<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 홈 대시보드 & 라디오</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-glass: rgba(10, 14, 23, 0.65);
            --border-glass: rgba(255, 255, 255, 0.18);
            --accent-yellow: #ffe082;
            --accent-blue: #81d4fa;
            --accent-green: #00e676;
            --accent-pink: #ff80ab;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #05070a; color: #ffffff;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #bg-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 1; transition: filter 0.4s ease, background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: brightness(1);
        }

        .top-radio-bar {
            position: fixed; top: 12px; right: 12px; z-index: 99999;
            display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
        }

        .radio-btn-row {
            display: flex; gap: 6px; background: rgba(8, 10, 15, 0.7);
            padding: 4px 6px; border-radius: 16px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .radio-icon-btn, .settings-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #f1f5f9; height: 36px; padding: 0 12px;
            font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .radio-icon-btn:hover, .settings-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .radio-active {
            background: rgba(0, 230, 118, 0.25) !important;
            border-color: var(--accent-green) !important;
            color: #ffffff !important;
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.4);
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
        }

        #settings-panel {
            position: fixed; top: 0; right: -420px;
            width: 380px; height: 100vh;
            background: rgba(10, 13, 20, 0.92); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.15); z-index: 100000;
            padding: 24px 20px; display: flex; flex-direction: column; gap: 18px;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto;
            box-shadow: -15px 0 35px rgba(0, 0, 0, 0.6);
            touch-action: pan-y;
        }

        #settings-panel.open { right: 0; }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 12px;
        }

        .panel-close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .setting-item { display: flex; flex-direction: column; gap: 6px; }
        .setting-label { font-size: 13px; font-weight: bold; color: var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .slider-input { width: 100%; cursor: pointer; accent-color: var(--accent-blue); }
        .url-input-container { display: flex; gap: 6px; }
        
        .text-input {
            flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none;
            transition: border-color 0.2s;
        }
        .text-input:focus { border-color: var(--accent-blue); }

        .action-btn {
            background: var(--accent-blue); border: none; color: #000;
            padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer;
        }

        .file-upload-label {
            background: rgba(255, 255, 255, 0.08); border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; font-size: 12px;
            transition: background 0.2s;
        }
        .file-upload-label:hover { background: rgba(255, 255, 255, 0.15); }

        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
        .gallery-card {
            position: relative; height: 85px; border-radius: 10px; overflow: hidden;
            border: 2px solid transparent; cursor: pointer; background-size: cover; background-position: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .gallery-card:hover { transform: scale(1.02); }
        .gallery-card.selected { border-color: var(--accent-yellow); box-shadow: 0 0 12px rgba(255, 224, 130, 0.5); }
        
        .card-btn-group {
            position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
        }
        .gallery-btn {
            background: rgba(0, 0, 0, 0.75); border: none; color: white;
            width: 24px; height: 24px; border-radius: 50%; font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }

        .dashboard-container {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh; width: 100vw;
            text-align: center; gap: min(2.2vh, 18px); padding: 10px 0;
            pointer-events: none;
        }

        /* Date & D-Day Card */
        .date-card {
            background: var(--bg-glass); padding: min(1.2vh, 8px) min(3vw, 26px); border-radius: 30px;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); font-size: min(3.6vh, 32px); font-weight: 800;
            display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        .dday-tag {
            color: var(--accent-yellow); background: rgba(255, 224, 130, 0.18);
            padding: 3px 14px; border-radius: 16px; border: 1.5px solid rgba(255, 224, 130, 0.5); font-weight: 900;
        }

        /* Digital Clock */
        .time-text {
            font-size: min(22vh, 19vw); font-weight: 900; line-height: 0.82;
            font-variant-numeric: tabular-nums; letter-spacing: -3px;
            color: #ffffff !important;
            text-shadow: 0 6px 35px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.8);
        }

        /* Weather Card */
        .weather-card {
            display: inline-flex; align-items: center; justify-content: center;
            font-size: min(5.5vh, 48px); font-weight: 900; background: var(--bg-glass);
            padding: min(1.2vh, 8px) min(4vw, 32px); border-radius: 40px; backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); gap: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        .divider { width: 3px; height: min(3.5vh, 30px); background-color: rgba(255, 255, 255, 0.25); border-radius: 2px; }
        .temp-color { color: var(--accent-yellow); }
        .hum-color { color: var(--accent-blue); }

        /* Quote Card */
        .quote-card {
            background: var(--bg-glass); padding: min(1.4vh, 10px) min(3vw, 28px); border-radius: 20px;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); max-width: 80%;
            transition: opacity 0.5s ease-in-out;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        .quote-text { font-size: min(3vh, 24px); font-weight: 700; color: #ffffff; word-break: keep-all; }
        .quote-author { font-size: min(2vh, 15px); font-weight: 500; color: #cbd5e1; margin-top: 2px; }
    </style>
</head>
<body>
    <div id="bg-container"></div>
    <audio id="mainAudio" preload="none" crossorigin="anonymous"></audio>

    <!-- Top Radio Control Bar -->
    <div class="top-radio-bar">
        <div class="radio-btn-row">
            <button id="feedNoiseBtn" class="radio-icon-btn" onclick="toggleRadio('feedNoise')"><span>🍼</span><span>수유소음</span></button>
            <button id="sleepNoiseBtn" class="radio-icon-btn" onclick="toggleRadio('sleepNoise')"><span>🌙</span><span>수면소음</span></button>
            <button id="mbcBtn" class="radio-icon-btn" onclick="toggleRadio('mbc')"><span>📻</span><span>MBC 95.9</span></button>
            <button id="kbsBtn" class="radio-icon-btn" onclick="toggleRadio('kbs')"><span>🎻</span><span>KBS 클래식</span></button>
            <button class="settings-btn" onclick="toggleSettingsPanel()">⚙️ 설정</button>
        </div>
        <div class="radio-btn-row">
            <button id="bbcKidsBtn" class="radio-icon-btn" onclick="toggleRadio('bbcKids')"><span>🇬🇧</span><span>BBC World</span></button>
            <button id="disneyBtn" class="radio-icon-btn" onclick="toggleRadio('disney')"><span>🏰</span><span>디즈니 OST</span></button>
            <button id="sbsPowerBtn" class="radio-icon-btn" onclick="toggleRadio('sbsPower')"><span>📻</span><span>SBS 107.7</span></button>
            <button id="kbsCoolBtn" class="radio-icon-btn" onclick="toggleRadio('kbsCool')"><span>🎧</span><span>KBS 89.1</span></button>
        </div>
    </div>

    <!-- Settings Slide Panel -->
    <div id="settings-panel">
        <div class="panel-header">
            <h3>⚙️ 대시보드 & 스토리지</h3>
            <button class="panel-close-btn" onclick="toggleSettingsPanel()">✕</button>
        </div>

        <div class="setting-item">
            <span class="setting-label">💡 화면 밝기 조절</span>
            <input type="range" id="brightnessSlider" class="slider-input" min="10" max="100" value="100" oninput="changeBrightness(this.value)">
        </div>

        <div class="setting-item">
            <span class="setting-label">🔄 배경 자동 슬라이드쇼</span>
            <select id="slideshowSelect" class="text-input" onchange="changeSlideshowInterval(this.value)">
                <option value="0">사용 안함</option>
                <option value="10000">10초 마다</option>
                <option value="30000">30초 마다</option>
                <option value="60000">1분 마다</option>
            </select>
        </div>

        <div class="setting-item">
            <span class="setting-label">☁️ Cloudinary 클라우드 설정</span>
            <input type="text" id="cloudNameInput" class="text-input" placeholder="Cloud Name (예: demo)" onchange="saveCloudConfig()">
            <input type="text" id="uploadPresetInput" class="text-input" placeholder="Unsigned Upload Preset" onchange="saveCloudConfig()">
        </div>

        <div class="setting-item">
            <span class="setting-label">📤 클라우드로 이미지 업로드</span>
            <label class="file-upload-label">
                📂 사진 파일 선택 (JPG, PNG)
                <input type="file" id="cloudUploader" accept="image/*" style="display:none;" onchange="uploadToCloudinary(event)">
            </label>
        </div>

        <div class="setting-item">
            <span class="setting-label">🔗 외부 이미지 직링크 URL 추가</span>
            <div class="url-input-container">
                <input type="text" id="imageUrlInput" class="text-input" placeholder="https://example.com/image.jpg">
                <button class="action-btn" onclick="addExternalImageUrl()">추가</button>
            </div>
        </div>

        <div class="setting-item">
            <span class="setting-label">🖼️ 배경 갤러리</span>
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <!-- Main Center Dashboard -->
    <div class="dashboard-container">
        <div class="date-card">
            <span id="js-date">----년 --월 --일</span>
            <span id="js-dday" class="dday-tag">D+--일</span>
        </div>
        <div id="js-time" class="time-text">--:--:--</div>
        <div class="weather-card">
            <div id="js-temp" class="temp-color">☀️ --°C</div>
            <div class="divider"></div>
            <div id="js-hum" class="hum-color">💧 --%</div>
        </div>
        <div id="quoteCard" class="quote-card">
            <div id="js-quote-text" class="quote-text">“삶이 있는 한 희망은 있다.”</div>
            <div id="js-quote-author" class="quote-author">- 키케로 -</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = dayNames[now.getDay()];
            document.getElementById('js-date').innerText = `${year}년 ${month}월 ${date}일 (${dayOfWeek})`;
            
            const birthDate = new Date(2026, 6, 24);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24)) + 1;
            
            const ddayElem = document.getElementById('js-dday');
            if (diffDays > 0) ddayElem.innerText = `나은 D+${diffDays}일`;
            else if (diffDays === 0) ddayElem.innerText = `나은 출생일! 🎉`;
            else ddayElem.innerText = `나은 D${diffDays}일`;
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('js-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        async function fetchWeather() {
            try {
                const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FSeoul");
                const data = await res.json();
                const code = data.current.weather_code;
                let icon = "☀️";
                if (code >= 1 && code <= 3) icon = "⛅";
                else if (code >= 45 && code <= 48) icon = "🌫️";
                else if (code >= 51 && code <= 67) icon = "🌧️";
                else if (code >= 71 && code <= 77) icon = "❄️";
                else if (code >= 80) icon = "🌦️";

                document.getElementById('js-temp').innerText = `${icon} ${data.current.temperature_2m}°C`;
                document.getElementById('js-hum').innerText = `💧 ${data.current.relative_humidity_2m}%`;
            } catch(e) {}
        }
        fetchWeather();
        setInterval(fetchWeather, 300000);

        const QUOTES = [
            { quote: "삶이 있는 한 희망은 있다.", author: "키케로" },
            { quote: "오늘 할 수 있는 일에 전력을 다하라.", author: "괴테" },
            { quote: "행복은 습관이다. 그것을 몸에 익혀라.", author: "허버드" },
            { quote: "어제는 역사이고, 내일은 미스터리이며, 오늘은 선물이다.", author: "엘리너 루스벨트" },
            { quote: "작은 기회로부터 위대한 업적이 시작된다.", author: "데모스테네스" }
        ];
        let quoteIndex = 0;
        function rotateQuotes() {
            const card = document.getElementById('quoteCard');
            card.style.opacity = '0';
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % QUOTES.length;
                document.getElementById('js-quote-text').innerText = `“${QUOTES[quoteIndex].quote}”`;
                document.getElementById('js-quote-author').innerText = `- ${QUOTES[quoteIndex].author} -`;
                card.style.opacity = '1';
            }, 500);
        }
        setInterval(rotateQuotes, 12000);

        const DEFAULT_PRESETS = [
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80"
        ];

        let galleryImages = JSON.parse(localStorage.getItem('smart_clock_bgs')) || DEFAULT_PRESETS;
        let selectedBgIndex = parseInt(localStorage.getItem('smart_clock_bg_idx') || '0');
        let slideshowTimer = null;

        function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('open'); }
        function changeBrightness(val) { document.getElementById('bg-container').style.filter = `brightness(${val / 100})`; }

        function saveCloudConfig() {
            localStorage.setItem('cloud_name', document.getElementById('cloudNameInput').value.trim());
            localStorage.setItem('upload_preset', document.getElementById('uploadPresetInput').value.trim());
        }

        function loadCloudConfig() {
            document.getElementById('cloudNameInput').value = localStorage.getItem('cloud_name') || '';
            document.getElementById('uploadPresetInput').value = localStorage.getItem('upload_preset') || '';
        }
        loadCloudConfig();

        async function uploadToCloudinary(e) {
            const file = e.target.files[0];
            const cloudName = localStorage.getItem('cloud_name');
            const uploadPreset = localStorage.getItem('upload_preset');

            if (!file) return;
            if (!cloudName || !uploadPreset) {
                alert("Cloudinary 스토리지 설정을 먼저 입력해 주세요!");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                    method: 'POST', body: formData
                });
                const data = await res.json();
                if (data.secure_url) {
                    galleryImages.unshift(data.secure_url);
                    selectedBgIndex = 0;
                    saveGalleryState(); renderGallery();
                    alert("클라우드에 업로드 완료!");
                } else { alert("업로드 실패: 설정을 확인해 보세요."); }
            } catch(err) { alert("클라우드 통신 에러가 발생했습니다."); }
        }

        function addExternalImageUrl() {
            const input = document.getElementById('imageUrlInput');
            const url = input.value.trim();
            if (!url) return;
            galleryImages.unshift(url);
            selectedBgIndex = 0;
            input.value = '';
            saveGalleryState(); renderGallery();
        }

        function downloadImage(e, url) {
            e.stopPropagation();
            const a = document.createElement('a');
            a.href = url; a.target = '_blank';
            a.download = 'background.jpg';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function nextBg() {
            if (galleryImages.length === 0) return;
            selectedBgIndex = (selectedBgIndex + 1) % galleryImages.length;
            saveGalleryState(); renderGallery();
        }

        function prevBg() {
            if (galleryImages.length === 0) return;
            selectedBgIndex = (selectedBgIndex - 1 + galleryImages.length) % galleryImages.length;
            saveGalleryState(); renderGallery();
        }

        function selectBg(index) { selectedBgIndex = index; saveGalleryState(); renderGallery(); }
        function deleteBg(e, index) {
            e.stopPropagation();
            galleryImages.splice(index, 1);
            if (selectedBgIndex >= galleryImages.length) selectedBgIndex = galleryImages.length - 1;
            saveGalleryState(); renderGallery();
        }

        function saveGalleryState() {
            localStorage.setItem('smart_clock_bgs', JSON.stringify(galleryImages));
            localStorage.setItem('smart_clock_bg_idx', selectedBgIndex);
        }

        function changeSlideshowInterval(ms) {
            if (slideshowTimer) clearInterval(slideshowTimer);
            const interval = parseInt(ms);
            if (interval > 0) {
                slideshowTimer = setInterval(() => { nextBg(); }, interval);
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const bgContainer = document.getElementById('bg-container');
            grid.innerHTML = '';

            if (selectedBgIndex >= 0 && galleryImages[selectedBgIndex]) {
                bgContainer.style.backgroundImage = `url('${galleryImages[selectedBgIndex]}')`;
            } else {
                bgContainer.style.backgroundImage = 'none';
            }

            galleryImages.forEach((imgSrc, idx) => {
                const card = document.createElement('div');
                card.className = `gallery-card ${idx === selectedBgIndex ? 'selected' : ''}`;
                card.style.backgroundImage = `url('${imgSrc}')`;
                card.onclick = () => selectBg(idx);

                card.innerHTML = `
                    <div class="card-btn-group">
                        <button class="gallery-btn" onclick="downloadImage(event, '${imgSrc}')">💾</button>
                        <button class="gallery-btn" onclick="deleteBg(event, ${idx})">✕</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        renderGallery();

        let startY = 0;
        window.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            const diffY = startY - endY;

            if (document.getElementById('settings-panel').classList.contains('open')) return;

            if (Math.abs(diffY) > 50) {
                if (diffY > 0) nextBg();
                else prevBg();
            }
        }, { passive: true });

        let wheelThrottle = false;
        window.addEventListener('wheel', (e) => {
            if (document.getElementById('settings-panel').classList.contains('open')) return;
            if (wheelThrottle) return;

            wheelThrottle = true;
            if (e.deltaY > 0) nextBg();
            else prevBg();

            setTimeout(() => { wheelThrottle = false; }, 600);
        });

        const mainAudio = document.getElementById('mainAudio');
        let currentType = 'none';
        let hlsPlayer = null;
        let audioCtx = null;
        let noiseNode = null;

        const RENDER_BACKEND_URL = "https://naeun-radio.onrender.com";

        async function getRadioStreamUrl(type) {
            if (type === 'bbcKids') return "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service";
            if (type === 'disney') return "https://stream.klassikradio.de/disney/mp3-128/stream.klassikradio.de/";
            
            const channelMap = {
                mbc: 'mbc_fm',
                kbs: 'kbs_classic',
                kbsCool: 'kbs_cool',
                sbsPower: 'sbs_power'
            };

            if (channelMap[type]) {
                try {
                    const res = await fetch(`${RENDER_BACKEND_URL}/api/get_stream_url?ch=${channelMap[type]}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.status === 'success' && data.url) return data.url;
                    }
                } catch(e) {}

                if (type === 'mbc') return "https://sf.cdn.imbc.com/sf/sf_sfm/_definst_/sf_sfm.stream/playlist.m3u8";
                if (type === 'kbs') return "https://kbsfmchannel.kbs.co.kr/hls/live/2004245/1fm/master.m3u8";
                if (type === 'kbsCool') return "https://kbsfmchannel.kbs.co.kr/hls/live/2004246/2fm/master.m3u8";
            }
            return "";
        }

        async function playRadioStream(type) {
            stopSynthesizedNoise();
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

            const url = await getRadioStreamUrl(type);
            if (!url) return;

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(mainAudio);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => mainAudio.play());
                } else if (mainAudio.canPlayType('application/vnd.apple.mpegurl')) {
                    mainAudio.src = url;
                    mainAudio.play();
                }
            } else {
                mainAudio.src = url;
                mainAudio.play();
            }

            currentType = type;
            updateBtnUI();
        }

        function playSynthesizedNoise(type) {
            stopRadio();
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);

            if (type === 'feedNoise') {
                let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                    b6 = white * 0.115926;
                }
            } else {
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = output[i];
                    output[i] *= 3.5;
                }
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();

            currentType = type;
            updateBtnUI();
        }

        function stopSynthesizedNoise() {
            if (noiseNode) {
                try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {}
                noiseNode = null;
            }
        }

        function stopRadio() {
            mainAudio.pause();
            mainAudio.removeAttribute('src');
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
            stopSynthesizedNoise();
            currentType = 'none';
            updateBtnUI();
        }

        function updateBtnUI() {
            ['feedNoise', 'sleepNoise', 'mbc', 'kbs', 'bbcKids', 'disney', 'sbsPower', 'kbsCool'].forEach(id => {
                const btn = document.getElementById(id + 'Btn');
                if (btn) btn.classList.remove('radio-active');
            });
            if (currentType !== 'none') {
                const activeBtn = document.getElementById(currentType + 'Btn');
                if (activeBtn) activeBtn.classList.add('radio-active');
            }
        }

        function toggleRadio(type) {
            if (currentType === type) stopRadio();
            else {
                if (type === 'feedNoise' || type === 'sleepNoise') playSynthesizedNoise(type);
                else playRadioStream(type);
            }
        }
    </script>
</body>
</html>
