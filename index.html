<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 대시보드 & 라디오</title>
    <!-- HLS.js 스트리밍 지원 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-glass: rgba(0, 0, 0, 0.65);
            --border-glass: rgba(255, 255, 255, 0.25);
            --accent-yellow: #ffeb3b;
            --accent-blue: #81d4fa;
            --accent-green: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111119;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 배경 레이어 및 transition 효과 */
        #bg-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: filter 0.3s ease, background-image 0.8s ease-in-out;
            filter: brightness(1);
        }

        /* 상단 라디오 컨트롤 바 */
        .top-radio-bar {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 9999;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .radio-btn-container { display: flex; gap: 0; }

        .radio-icon-btn, .settings-btn {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-right: none;
            color: #ffffff;
            height: 44px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .radio-icon-btn:first-child { border-radius: 0 0 0 14px; }
        .radio-active {
            background: var(--accent-green) !important;
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 15px rgba(129, 212, 250, 0.6);
        }

        .settings-btn {
            background: rgba(40, 40, 50, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 우측 사이드바 설정 패널 */
        #settings-panel {
            position: fixed;
            top: 0; right: -380px;
            width: 360px; height: 100vh;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10000;
            padding: 24px 20px;
            display: flex; flex-direction: column; gap: 20px;
            transition: right 0.3s ease-in-out;
            overflow-y: auto;
        }

        #settings-panel.open { right: 0; }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 12px;
        }

        .panel-close-btn {
            background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
        }

        .setting-item { display: flex; flex-direction: column; gap: 8px; }
        .setting-label { font-size: 14px; font-weight: bold; color: var(--accent-blue); }

        .slider-input {
            width: 100%; cursor: pointer; accent-color: var(--accent-blue);
        }

        .url-input-container {
            display: flex; gap: 6px;
        }

        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .action-btn {
            background: var(--accent-green);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 갤러리 그리드 */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px;
        }

        .gallery-card {
            position: relative; height: 90px; border-radius: 8px; overflow: hidden;
            border: 2px solid transparent; cursor: pointer;
            background-size: cover; background-position: center;
        }

        .gallery-card.selected { border-color: var(--accent-yellow); }

        .gallery-del-btn {
            position: absolute; top: 4px; right: 4px;
            background: rgba(200, 0, 0, 0.8); border: none; color: white;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* 메인 대시보드 레이아웃 */
        .dashboard-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            text-align: center;
            gap: 18px;
            padding-top: 20px;
        }

        .date-card {
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--border-glass);
            font-size: min(4.5vw, 38px);
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }

        .dday-tag {
            color: var(--accent-yellow);
            background: rgba(255, 235, 59, 0.15);
            padding: 2px 14px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 235, 59, 0.5);
            font-weight: 900;
        }

        .time-text {
            font-size: min(23vw, 200px);
            font-weight: 900;
            line-height: 0.85;
            font-variant-numeric: tabular-nums;
            letter-spacing: -4px;
        }

        .weather-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: min(6.5vw, 60px);
            font-weight: 900;
            background: var(--bg-glass);
            padding: 8px 36px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--border-glass);
            gap: 24px;
        }

        .divider {
            width: 3px;
            height: 38px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        .temp-color { color: var(--accent-yellow); }
        .hum-color { color: var(--accent-blue); }

        .quote-card {
            background: var(--bg-glass);
            padding: 12px 30px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--border-glass);
            max-width: 85%;
        }

        .quote-text {
            font-size: min(3.8vw, 28px);
            font-weight: 700;
            color: #f1f5f9;
            word-break: keep-all;
        }

        .quote-author {
            font-size: min(2.3vw, 18px);
            font-weight: 500;
            color: #cbd5e1;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="bg-container"></div>
    <audio id="mainAudio" preload="none" crossorigin="anonymous"></audio>

    <!-- 상단 라디오 및 설정 메뉴 바 -->
    <div class="top-radio-bar">
        <div class="radio-btn-container">
            <button id="feedNoiseBtn" class="radio-icon-btn" onclick="toggleRadio('feedNoise')"><span>🍼</span><span>수유소음</span></button>
            <button id="sleepNoiseBtn" class="radio-icon-btn" onclick="toggleRadio('sleepNoise')"><span>🌙</span><span>수면소음</span></button>
            <button id="bbcKidsBtn" class="radio-icon-btn" onclick="toggleRadio('bbcKids')"><span>🇬🇧</span><span>BBC 라디오</span></button>
            <button id="disneyBtn" class="radio-icon-btn" onclick="toggleRadio('disney')"><span>🏰</span><span>디즈니 OST</span></button>
            <button id="mbcBtn" class="radio-icon-btn" onclick="toggleRadio('mbc')"><span>📻</span><span>MBC 95.9</span></button>
            <button id="kbsBtn" class="radio-icon-btn" onclick="toggleRadio('kbs')"><span>🎻</span><span>KBS 클래식</span></button>
            <button class="settings-btn" onclick="toggleSettingsPanel()">⚙️ 설정</button>
        </div>
    </div>

    <!-- 우측 설정 및 이미지 패널 -->
    <div id="settings-panel">
        <div class="panel-header">
            <h3>⚙️ 대시보드 설정</h3>
            <button class="panel-close-btn" onclick="toggleSettingsPanel()">✕</button>
        </div>

        <div class="setting-item">
            <span class="setting-label">💡 화면 밝기 조절</span>
            <input type="range" id="brightnessSlider" class="slider-input" min="10" max="100" value="100" oninput="changeBrightness(this.value)">
        </div>

        <div class="setting-item">
            <span class="setting-label">🔗 이미지 URL 추가 (공용 저장소/Imgur 등)</span>
            <div class="url-input-container">
                <input type="text" id="imageUrlInput" class="text-input" placeholder="https://example.com/image.jpg">
                <button class="action-btn" onclick="addExternalImageUrl()">추가</button>
            </div>
        </div>

        <div class="setting-item">
            <span class="setting-label">🖼️ 저장된 배경 목록</span>
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <!-- 메인 대시보드 -->
    <div class="dashboard-container">
        <div class="date-card">
            <span id="js-date">----년 --월 --일</span>
            <span id="js-dday" class="dday-tag">D+--일</span>
        </div>
        <div id="js-time" class="time-text">--:--:--</div>
        <div class="weather-card">
            <div id="js-temp" class="temp-color">🌡️ --°C</div>
            <div class="divider"></div>
            <div id="js-hum" class="hum-color">💧 --%</div>
        </div>
        <div class="quote-card">
            <div id="js-quote-text" class="quote-text">“삶이 있는 한 희망은 있다.”</div>
            <div id="js-quote-author" class="quote-author">- 키케로 -</div>
        </div>
    </div>

    <script>
        // 1. 실시간 시계 & D-day
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = dayNames[now.getDay()];
            document.getElementById('js-date').innerText = `${year}년 ${month}월 ${date}일 (${dayOfWeek})`;
            
            const birthDate = new Date(2026, 6, 24);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24)) + 1;
            
            const ddayElem = document.getElementById('js-dday');
            if (diffDays > 0) ddayElem.innerText = `나은 D+${diffDays}일`;
            else if (diffDays === 0) ddayElem.innerText = `나은 출생일! 🎉`;
            else ddayElem.innerText = `나은 D${diffDays}일`;
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('js-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 2. Open-Meteo 날씨 정보
        async function fetchWeather() {
            try {
                const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul");
                const data = await res.json();
                document.getElementById('js-temp').innerText = `🌡️ ${data.current.temperature_2m}°C`;
                document.getElementById('js-hum').innerText = `💧 ${data.current.relative_humidity_2m}%`;
            } catch(e) {}
        }
        fetchWeather();
        setInterval(fetchWeather, 300000);

        // 3. 배경 이미지 갤러리 및 기본 고화질 Unsplash 프리셋 설정
        const DEFAULT_PRESETS = [
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80"
        ];

        let galleryImages = JSON.parse(localStorage.getItem('smart_clock_bgs')) || DEFAULT_PRESETS;
        let selectedBgIndex = parseInt(localStorage.getItem('smart_clock_bg_idx') || '0');

        function toggleSettingsPanel() {
            document.getElementById('settings-panel').classList.toggle('open');
        }

        function changeBrightness(val) {
            document.getElementById('bg-container').style.filter = `brightness(${val / 100})`;
        }

        function addExternalImageUrl() {
            const input = document.getElementById('imageUrlInput');
            const url = input.value.trim();
            if (!url) return;

            galleryImages.unshift(url);
            selectedBgIndex = 0;
            input.value = '';
            saveGalleryState();
            renderGallery();
        }

        function selectBg(index) {
            selectedBgIndex = index;
            saveGalleryState();
            renderGallery();
        }

        function deleteBg(e, index) {
            e.stopPropagation();
            galleryImages.splice(index, 1);
            if (selectedBgIndex >= galleryImages.length) selectedBgIndex = galleryImages.length - 1;
            saveGalleryState();
            renderGallery();
        }

        function saveGalleryState() {
            localStorage.setItem('smart_clock_bgs', JSON.stringify(galleryImages));
            localStorage.setItem('smart_clock_bg_idx', selectedBgIndex);
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const bgContainer = document.getElementById('bg-container');
            grid.innerHTML = '';

            if (selectedBgIndex >= 0 && galleryImages[selectedBgIndex]) {
                bgContainer.style.backgroundImage = `url('${galleryImages[selectedBgIndex]}')`;
            } else {
                bgContainer.style.backgroundImage = 'none';
            }

            galleryImages.forEach((imgSrc, idx) => {
                const card = document.createElement('div');
                card.className = `gallery-card ${idx === selectedBgIndex ? 'selected' : ''}`;
                card.style.backgroundImage = `url('${imgSrc}')`;
                card.onclick = () => selectBg(idx);

                card.innerHTML = `
                    <button class="gallery-del-btn" onclick="deleteBg(event, ${idx})">✕</button>
                `;
                grid.appendChild(card);
            });
        }
        renderGallery();

        // 4. 오디오 & 라디오 연동
        const mainAudio = document.getElementById('mainAudio');
        let currentType = 'none';
        let hlsPlayer = null;
        let audioCtx = null;
        let noiseNode = null;

        const RENDER_BACKEND_URL = "https://naeun-radio.onrender.com";

        async function getRadioStreamUrl(type) {
            if (type === 'bbcKids') return "http://as-hls-ww-live.akamaized.net/pool_26340777/live/ww/bbc_afrique_radio/bbc_afrique_radio.isml/bbc_afrique_radio-audio%3d320000.norewind.m3u8";
            if (type === 'disney') return "https://stream.klassikradio.de/lounge/mp3-128/stream.klassikradio.de/";
            
            if (type === 'mbc' || type === 'kbs') {
                const chCode = (type === 'mbc') ? 'mbc_fm' : 'kbs_classic';
                try {
                    const res = await fetch(`${RENDER_BACKEND_URL}/api/get_stream_url?ch=${chCode}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.status === 'success' && data.url) return data.url;
                    }
                } catch(e) {}
                
                if (type === 'mbc') return "https://sf.cdn.imbc.com/sf/sf_sfm/_definst_/sf_sfm.stream/playlist.m3u8";
                if (type === 'kbs') return "https://kbsfmchannel.kbs.co.kr/hls/live/2004245/1fm/master.m3u8";
            }
            return "";
        }

        async function playRadioStream(type) {
            stopSynthesizedNoise();
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

            const url = await getRadioStreamUrl(type);
            if (!url) return;

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(mainAudio);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => mainAudio.play());
                } else if (mainAudio.canPlayType('application/vnd.apple.mpegurl')) {
                    mainAudio.src = url;
                    mainAudio.play();
                }
            } else {
                mainAudio.src = url;
                mainAudio.play();
            }

            currentType = type;
            updateBtnUI();
        }

        function playSynthesizedNoise(type) {
            stopRadio();
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);

            if (type === 'feedNoise') {
                let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                    b6 = white * 0.115926;
                }
            } else {
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = output[i];
                    output[i] *= 3.5;
                }
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();

            currentType = type;
            updateBtnUI();
        }

        function stopSynthesizedNoise() {
            if (noiseNode) {
                try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {}
                noiseNode = null;
            }
        }

        function stopRadio() {
            mainAudio.pause();
            mainAudio.removeAttribute('src');
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
            stopSynthesizedNoise();
            currentType = 'none';
            updateBtnUI();
        }

        function updateBtnUI() {
            ['feedNoise', 'sleepNoise', 'bbcKids', 'disney', 'mbc', 'kbs'].forEach(id => {
                const btn = document.getElementById(id + 'Btn');
                if (btn) btn.classList.remove('radio-active');
            });
            if (currentType !== 'none') {
                const activeBtn = document.getElementById(currentType + 'Btn');
                if (activeBtn) activeBtn.classList.add('radio-active');
            }
        }

        function toggleRadio(type) {
            if (currentType === type) stopRadio();
            else {
                if (type === 'feedNoise' || type === 'sleepNoise') playSynthesizedNoise(type);
                else playRadioStream(type);
            }
        }
    </script>
</body>
</html>
